services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DOUBAO_API_KEY=${DOUBAO_API_KEY}
      - DOUBAO_MODEL=${DOUBAO_MODEL}
      - DOUBAO_API_BASE=${DOUBAO_API_BASE}
      - APP_SECRET_KEY=${APP_SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
      - INTERVIEW_DB_PATH=/app/data-store/interview.db
    volumes:
      # 只挂载需要持久化的数据目录。
      # 原先挂了 ./backend:/app、./ai:/app/ai、./data:/app/data，
      # 后两个会用根目录的旧副本（Database 只有 19 个方法）覆盖镜像里的
      # 正确实现（46 个方法），容器一跑就 AttributeError。
      - backend_data:/app/data-store
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
